<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="yes" />
    <meta name="screen-orientation" content="portrait" />
    <script src="https://connect.facebook.net/en_US/fbinstant.6.3.js"></script>

    <title>Klondike Solitaire</title>
    <link rel="shortcut icon" type="image/x-icon" href="/client/assets/images/game-icon.ico">
    <link rel="stylesheet" href="style.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/client/styles/ManufacturerScene.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/client/styles/PauseScene.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/client/styles/PlayScene.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/client/styles/ConfirmScene.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/client/styles/LevelCompleteScene.css" type="text/css" media="all" />
</head>

<body>
    <div id="gameWrapper">
        <!--MANUFACTURER SCREEN-->
        <section id="manufacturerScreen">
            
        </section>
        
        <!--PRELOAD SCREEN-->
        <section id="preloadScreen">
            
        </section>
        <!--TITLE SCREEN-->
        <section id="titleScreen">
            
        </section>  
        <!--PLAY SCREEN-->
        <section id="playScreen"> </section>
        <!--PAUSE SCREEN-->
        <section id="pauseScreen">
                <div id="resume">
            <button id="pause_resumeBtn">X</button>
            <button id="title">paused</button>  
            </div>
            <div id="others">
                <button id="pause_restartBtn">RESTART</button>
                <button id="pause_saveBtn">SAVE</button>
                <button id="pause_menuBtn">MENU</button> 
                </div>
        </section>
        <!-- RESTART CONFIRMATION DIALOGUE BOX -->
        <section id="confirmScreen">
            <div id="title">
                <p id = "confirmText">Text goes here?</p> 
            </div>
            <div id="others">
                <button id="yesBtn">✅</button>
                <button id="noBtn">❌</button> 
            </div>
        </section>
        <!--END-OF-LEVEL SCREEN-->
        <section id="levelCompleteScreen">
            <div id="message">
                <h1>Level Complete!</h1>
                <div id="summary">
                    <p id="total_moves">Moves: 0</p>  
                    <p id="time_bonus">Time bonus: 0</p> 
                    <p id="total_score">Total score: 0</p>
                </div>
            </div>
            <div id="buttons">
                <button id="levelComplete_replayBtn">Replay</button>
                <button id="levelComplete_menuBtn">Menu</button> 
                <button id="levelComplete_newGameBtn">New Game</button>
            </div>
            
        </section>
    </div>
    <script src="/client/lib/phaser_v87/phaser.min.js"></script>
    <script type = "module" src="script.js"></script>
</body>

</html>
